<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        th:replace="fragments/layout :: layout(~{::title}, ~{::main})"
>
<head>
    <title th:text="${student.id == null ? 'Add Student' : 'Edit Student'}">Student Form</title>
</head>
<body>
<main>
    <h2 th:text="${student.id == null ? 'Add New Student' : 'Edit Student'}">Student Form</h2>
    <a th:href="@{/students}" class="btn btn-secondary mb-3">Back to List</a>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/students/save}" th:object="${student}" method="post" id="studentForm">
                <input type="hidden" th:field="*{id}" />

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" th:field="*{name}" id="name" />
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
                    <div class="text-danger" id="nameError" style="display: none;"></div>
                </div>

                <!-- Age -->
                <div class="mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" class="form-control" th:field="*{age}" id="age" />
                    <div class="text-danger" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age Error</div>
                    <div class="text-danger" id="ageError" style="display: none;"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" id="email" />
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email Error</div>
                    <div class="text-danger" id="emailError" style="display: none;"></div>
                </div>

                <!-- Course -->
                <div class="mb-3">
                    <label for="course" class="form-label">Course</label>
                    <select class="form-select" th:field="*{course}" id="course">
                        <option value="">Select a course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Biology">Biology</option>
                        <option value="Engineering">Engineering</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('course')}" th:errors="*{course}">Course Error</div>
                    <div class="text-danger" id="courseError" style="display: none;"></div>
                </div>

                <!-- Student ID -->
                <div class="mb-3">
                    <label for="studentId" class="form-label">Student ID</label>
                    <input type="text" class="form-control" th:field="*{studentId}" id="studentId" placeholder="e.g., CS123456" />
                    <div class="text-small text-muted">Must be 8 characters with uppercase letters and numbers only</div>
                    <div class="text-danger" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}">Student ID Error</div>
                    <div class="text-danger" id="studentIdError" style="display: none;"></div>
                </div>

                <!-- Buttons -->
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/students}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</main>

<!-- ✅ JavaScript validation client-side -->
<script>
    document.getElementById('studentForm').addEventListener('submit', function (e) {
        let isValid = true;

        // Reset previous error messages
        ['name', 'age', 'email', 'course', 'studentId'].forEach(id => {
            document.getElementById(id + 'Error').style.display = 'none';
        });

        // Name
        const name = document.getElementById('name').value.trim();
        if (name === '') {
            document.getElementById('nameError').innerText = 'Name is required.';
            document.getElementById('nameError').style.display = 'block';
            isValid = false;
        }

        // Age
        const age = document.getElementById('age').value.trim();
        if (age === '' || isNaN(age) || age <= 0) {
            document.getElementById('ageError').innerText = 'Please enter a valid age.';
            document.getElementById('ageError').style.display = 'block';
            isValid = false;
        }

        // Email
        const email = document.getElementById('email').value.trim();
        const emailPattern = /^[^@]+@[^@]+\.[a-z]{2,}$/i;
        if (email === '' || !emailPattern.test(email)) {
            document.getElementById('emailError').innerText = 'Enter a valid email address.';
            document.getElementById('emailError').style.display = 'block';
            isValid = false;
        }

        // Course
        const course = document.getElementById('course').value;
        if (course === '') {
            document.getElementById('courseError').innerText = 'Please select a course.';
            document.getElementById('courseError').style.display = 'block';
            isValid = false;
        }

        // Student ID
        const studentId = document.getElementById('studentId').value.trim();
        const studentIdPattern = /^[A-Z0-9]{8}$/;
        if (!studentIdPattern.test(studentId)) {
            document.getElementById('studentIdError').innerText = 'Student ID must be 8 characters (uppercase letters and numbers).';
            document.getElementById('studentIdError').style.display = 'block';
            isValid = false;
        }

        if (!isValid) {
            e.preventDefault(); // Prevent form submission if invalid
        }
    });
</script>
</body>
</html>
