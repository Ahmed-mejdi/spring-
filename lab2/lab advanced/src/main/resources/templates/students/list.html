<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        th:replace="fragments/layout :: layout(~{::title}, ~{::main})"
>
<head>
    <title>Students - Student Portal</title>
</head>
<body>
<main>
    <h2>Students</h2>

    <!-- Barre de recherche -->
    <div class="row mb-4">
        <div class="col-md-6">
            <form th:action="@{/students/search}" method="get" class="d-flex">
                <input
                        type="text"
                        name="keyword"
                        th:value="${keyword}"
                        class="form-control me-2"
                        placeholder="Search by name, email, course..."
                />
                <button type="submit" class="btn btn-outline-primary">Search</button>
            </form>
        </div>
        <div class="col-md-6 text-end">
            <a th:href="@{/students/new}" class="btn btn-primary">Add New Student</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(students)}" class="alert alert-info">
        No students found. Please add a student.
    </div>

    <div th:unless="${#lists.isEmpty(students)}">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <!-- En-têtes de colonnes avec liens de tri -->
                <th>
                    <a th:href="@{/students(sort='id', direction=${currentSort == 'id' && currentDirection == 'asc' ? 'desc' : 'asc'}, page=${currentPage}, size=${pageSize})}" class="text-white text-decoration-none">
                        ID
                        <i th:if="${currentSort == 'id'}"
                           th:class="${currentDirection == 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down'}"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/students(sort='name', direction=${currentSort == 'name' && currentDirection == 'asc' ? 'desc' : 'asc'}, page=${currentPage}, size=${pageSize})}" class="text-white text-decoration-none">
                        Name
                        <i th:if="${currentSort == 'name'}"
                           th:class="${currentDirection == 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down'}"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/students(sort='age', direction=${currentSort == 'age' && currentDirection == 'asc' ? 'desc' : 'asc'}, page=${currentPage}, size=${pageSize})}" class="text-white text-decoration-none">
                        Age
                        <i th:if="${currentSort == 'age'}"
                           th:class="${currentDirection == 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down'}"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/students(sort='email', direction=${currentSort == 'email' && currentDirection == 'asc' ? 'desc' : 'asc'}, page=${currentPage}, size=${pageSize})}" class="text-white text-decoration-none">
                        Email
                        <i th:if="${currentSort == 'email'}"
                           th:class="${currentDirection == 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down'}"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/students(sort='course', direction=${currentSort == 'course' && currentDirection == 'asc' ? 'desc' : 'asc'}, page=${currentPage}, size=${pageSize})}" class="text-white text-decoration-none">
                        Course
                        <i th:if="${currentSort == 'course'}"
                           th:class="${currentDirection == 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down'}"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/students(sort='studentId', direction=${currentSort == 'studentId' && currentDirection == 'asc' ? 'desc' : 'asc'}, page=${currentPage}, size=${pageSize})}" class="text-white text-decoration-none">
                        Student ID
                        <i th:if="${currentSort == 'studentId'}"
                           th:class="${currentDirection == 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down'}"></i>
                    </a>
                </th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}">1</td>
                <td th:text="${student.name}">John Doe</td>
                <td th:text="${student.age}">21</td>
                <td th:text="${student.email}">john@example.com</td>
                <td th:text="${student.course}">Computer Science</td>
                <td th:text="${student.studentId}">CS123456</td>
                <td>
                    <a
                            th:href="@{/students/{id}(id=${student.id})}"
                            class="btn btn-sm btn-info"
                    >View</a
                    >
                    <a
                            th:href="@{/students/edit/{id}(id=${student.id})}"
                            class="btn btn-sm btn-warning"
                    >Edit</a
                    >
                    <a
                            th:href="@{/students/delete/{id}(id=${student.id})}"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this student?');"
                    >Delete</a
                    >
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-center">
            <nav aria-label="Page navigation">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                        <a class="page-link" th:href="@{/students(sort=${currentSort}, direction=${currentDirection}, page=${previousPage}, size=${pageSize})}" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}" th:classappend="${pageNum == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/students(sort=${currentSort}, direction=${currentDirection}, page=${pageNum}, size=${pageSize})}" th:text="${pageNum}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                        <a class="page-link" th:href="@{/students(sort=${currentSort}, direction=${currentDirection}, page=${nextPage}, size=${pageSize})}" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Sélecteur de taille de page -->
        <div class="mt-3 text-center">
            <span>Items per page: </span>
            <select id="pageSizeSelect" class="form-select-sm" style="width: auto; display: inline-block;">
                <option th:selected="${pageSize == 5}" value="5">5</option>
                <option th:selected="${pageSize == 10}" value="10">10</option>
                <option th:selected="${pageSize == 20}" value="20">20</option>
            </select>
        </div>

        <script>
            document.getElementById('pageSizeSelect').addEventListener('change', function() {
                window.location.href = `/students?sort=[[${currentSort}]]&direction=[[${currentDirection}]]&page=1&size=${this.value}`;
            });
        </script>
    </div>
</main>
</body>
</html>
